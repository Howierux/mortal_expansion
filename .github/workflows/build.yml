name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check salt enclosure rules
        run: |
          javac -d build/salt-checks src/main/java/com/howierux/mortalexpansion/sanctification/SaltEnclosure.java tests/java/com/howierux/mortalexpansion/sanctification/SaltEnclosureTest.java
          java -ea -cp build/salt-checks com.howierux.mortalexpansion.sanctification.SaltEnclosureTest

      - name: Check Haunt dawn timing
        run: |
          javac -d build/daylight-checks src/main/java/com/howierux/mortalexpansion/haunt/HauntDaylightWindow.java tests/java/com/howierux/mortalexpansion/haunt/HauntDaylightWindowTest.java
          java -ea -cp build/daylight-checks com.howierux.mortalexpansion.haunt.HauntDaylightWindowTest

      - name: Check spirit torch links
        run: |
          javac -d build/torch-checks src/main/java/com/howierux/mortalexpansion/entity/mob/SpiritTorchLinks.java tests/java/com/howierux/mortalexpansion/entity/mob/SpiritTorchLinksTest.java
          java -ea -cp build/torch-checks com.howierux.mortalexpansion.entity.mob.SpiritTorchLinksTest

      - name: Check fractional player Haunt
        run: |
          javac -d build/fraction-checks src/main/java/com/howierux/mortalexpansion/haunt/HauntTier.java src/main/java/com/howierux/mortalexpansion/haunt/FractionalHaunt.java tests/java/com/howierux/mortalexpansion/haunt/FractionalHauntTest.java
          java -ea -cp build/fraction-checks com.howierux.mortalexpansion.haunt.FractionalHauntTest

      - name: Check Haunt furnace timing
        run: |
          javac -d build/furnace-checks src/main/java/com/howierux/mortalexpansion/haunt/HauntTier.java src/main/java/com/howierux/mortalexpansion/haunt/HauntFurnaceTiming.java tests/java/com/howierux/mortalexpansion/haunt/HauntFurnaceTimingTest.java
          java -ea -cp build/furnace-checks com.howierux.mortalexpansion.haunt.HauntFurnaceTimingTest

      - name: Check spirit torch sanctification
        run: |
          javac -d build/torch-enclosure-checks src/main/java/com/howierux/mortalexpansion/sanctification/SaltEnclosure.java src/main/java/com/howierux/mortalexpansion/entity/mob/SpiritTorchLinks.java tests/java/com/howierux/mortalexpansion/sanctification/SpiritTorchEnclosureTest.java
          java -ea -cp build/torch-enclosure-checks com.howierux.mortalexpansion.sanctification.SpiritTorchEnclosureTest

      - name: Check Haunt effect policy
        run: |
          javac -d build/effect-checks src/main/java/com/howierux/mortalexpansion/haunt/effects/HauntEffectKind.java tests/java/com/howierux/mortalexpansion/haunt/HauntEffectPolicyTest.java
          java -ea -cp build/effect-checks com.howierux.mortalexpansion.haunt.HauntEffectPolicyTest

      - name: Check Book of Ectcetera content
        run: python3 tools/check_ectcetera.py

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify mod loading with data generation
        timeout-minutes: 5
        run: ./gradlew runData

      - name: Verify generated resource content and freshness
        run: |
          python3 tools/check_datagen.py
          git diff --exit-code -- src/generated/resources

      - name: Check death items and Spiritwells on a headless server
        timeout-minutes: 5
        run: |
          set -o pipefail
          ./gradlew runGameTestServer | tee build/deferred-items-gametest.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path("build/deferred-items-gametest.log").read_text()
          match = re.search(r"All (\d+) required tests passed", log)
          assert match and int(match.group(1)) >= 37, "Expected at least thirty-seven death-item, corpse-recovery, Spiritwell, and Haunt-effect GameTests to finish successfully"
          PY


name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check salt enclosure rules
        run: |
          javac -d build/salt-checks src/main/java/com/howierux/mortalexpansion/sanctification/SaltEnclosure.java tests/java/com/howierux/mortalexpansion/sanctification/SaltEnclosureTest.java
          java -ea -cp build/salt-checks com.howierux.mortalexpansion.sanctification.SaltEnclosureTest

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify mod loading with data generation
        timeout-minutes: 5
        run: ./gradlew runData

name: Fabric development build and gameplay checks
on:
  push:
    branches: [fabric-dev, fabric, 'fabric/**']
  pull_request:
    branches: [fabric-dev, fabric]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fabric-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify reused catalog artwork and models
        run: |
          python3 tools/import_catalog_assets.py
          python3 tools/validate_catalog_assets.py
          git diff --exit-code -- src/main/resources/assets
      - name: Build Fabric and run headless gameplay tests
        run: ./gradlew build --no-daemon
      - name: Regenerate and verify Fabric tags and loot
        run: |
          ./gradlew runDatagen --no-daemon
          git diff --exit-code -- src/main/generated
      - name: Upload Fabric development artifact
        uses: actions/upload-artifact@v4
        with:
          name: mortal-expansion-fabric-development
          path: fabric/build/libs/*.jar
          if-no-files-found: error

name: Optional JEI integration
on:
  push:
    branches-ignore: [fabric, fabric-dev, 'fabric/**']
  pull_request:
    branches-ignore: [fabric, fabric-dev, 'fabric/**']
jobs:
  jei-enabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify loading with JEI
        timeout-minutes: 5
        run: bash gradlew build runData -PwithJei

name: Mortal Integrations
on:
  push:
    paths:
      - 'addons/mortal-integrations/**'
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/mortal-integrations.yml'
  pull_request:
jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build base mod and standalone addon
        run: |
          bash gradlew build
          bash gradlew -p addons/mortal-integrations build
      - name: Verify client-side loading with JEI
        timeout-minutes: 5
        run: bash gradlew -p addons/mortal-integrations runData
      - name: Verify dedicated-server loading without JEI
        timeout-minutes: 5
        run: |
          set -o pipefail
          bash gradlew -p addons/mortal-integrations runGameTestServer -PwithoutJei | tee addon-tests.log
          grep -Eq 'All [1-9][0-9]* required tests passed' addon-tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: mortal-integrations
          path: addons/mortal-integrations/build/libs/*.jar
